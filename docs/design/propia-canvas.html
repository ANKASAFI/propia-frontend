<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PROPIA · Canvas de diseño</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root, [data-theme="light"] {
    --bg: #F4F6F9;
    --surface: #FFFFFF;
    --surface-2: #F8FAFC;
    --line: #E2E7EF;
    --line-strong: #CDD5E1;
    --text: #0F1B2D;
    --ink: #0A2148;
    --muted: #5B6678;
    --subtle: #8A94A6;
    --primary: #0A2148;
    --primary-hover: #13306A;
    --on-primary: #FFFFFF;
    --blue: #015FFB;
    --blue-soft: #E8F0FF;
    --teal: #0E8A70;
    --teal-solid: #1FB89A;
    --teal-soft: #E3F6F1;
    --amber: #B45309;
    --amber-soft: #FEF3C7;
    --red: #B42318;
    --red-soft: #FEE4E2;
    --side-bg: #0A2148;
    --side-text: #B9C5DB;
    --side-strong: #FFFFFF;
    --side-hover: rgba(255, 255, 255, 0.06);
    --side-active: rgba(255, 255, 255, 0.10);
    --side-line: rgba(255, 255, 255, 0.09);
    --logo-ink: #0A2148;
    --logo-ink-side: #FFFFFF;
    --tile-empty: #E2E7EF;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 1px 3px rgba(16, 24, 40, 0.06);
    --focus: 0 0 0 3px rgba(1, 95, 251, 0.18);
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #0B1120;
    --surface: #111A2C;
    --surface-2: #0E1626;
    --line: #1E2A40;
    --line-strong: #2C3A55;
    --text: #E5EAF3;
    --ink: #F2F5FA;
    --muted: #97A3B9;
    --subtle: #6B7891;
    --primary: #2F6BFF;
    --primary-hover: #4A7FFF;
    --on-primary: #FFFFFF;
    --blue: #6B9BFF;
    --blue-soft: rgba(91, 147, 255, 0.14);
    --teal: #34D3AE;
    --teal-solid: #1FB89A;
    --teal-soft: rgba(52, 211, 174, 0.12);
    --amber: #FBBF24;
    --amber-soft: rgba(251, 191, 36, 0.12);
    --red: #F97066;
    --red-soft: rgba(249, 112, 102, 0.12);
    --side-bg: #080D19;
    --side-text: #8F9BB2;
    --side-strong: #F2F5FA;
    --side-hover: rgba(255, 255, 255, 0.04);
    --side-active: rgba(255, 255, 255, 0.07);
    --side-line: #1A2438;
    --logo-ink: #F2F5FA;
    --logo-ink-side: #F2F5FA;
    --tile-empty: #22304A;
    --shadow: none;
    --focus: 0 0 0 3px rgba(107, 155, 255, 0.25);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 13.5px;
    line-height: 1.45;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  .num { font-variant-numeric: tabular-nums; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
  svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- Canvas chrome ---------- */
  .canvas-bar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 18px;
    padding: 14px 32px; background: var(--surface); border-bottom: 1px solid var(--line);
  }
  .canvas-bar .title { font-weight: 600; color: var(--ink); }
  .canvas-bar .meta { color: var(--muted); }
  .canvas-bar .spacer { flex: 1; }
  .canvas-index { display: flex; flex-wrap: wrap; gap: 6px; padding: 16px 32px 0; }
  .canvas-index a { color: var(--muted); text-decoration: none; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 12.5px; }
  .canvas-index a:hover { color: var(--ink); border-color: var(--line-strong); }
  .canvas { padding: 24px 32px 80px; display: flex; flex-direction: column; gap: 48px; align-items: flex-start; }
  .artboard-label { display: flex; align-items: baseline; gap: 12px; margin: 0 0 12px; }
  .artboard-label h2 { margin: 0; font-size: 15px; font-weight: 600; color: var(--ink); }
  .artboard-label span { color: var(--muted); font-size: 12.5px; }
  .board {
    width: 1440px; height: 900px; overflow: hidden; position: relative;
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 12px 40px rgba(10, 33, 72, 0.08);
  }
  body.single .canvas-bar, body.single .canvas-index, body.single .artboard-label { display: none; }
  body.single .canvas { padding: 0; gap: 0; }
  body.single .board { border: 0; border-radius: 0; box-shadow: none; }

  /* ---------- App shell ---------- */
  .app { display: grid; grid-template-columns: 248px 1fr; grid-template-rows: 100%; height: 100%; }
  .side { background: var(--side-bg); color: var(--side-text); display: flex; flex-direction: column; border-right: 1px solid var(--side-line); }
  .side .brand { height: 64px; display: flex; align-items: center; gap: 10px; padding: 0 20px; border-bottom: 1px solid var(--side-line); }
  .side .env { margin-left: auto; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--side-text); border: 1px solid var(--side-line); border-radius: 4px; padding: 2px 6px; }
  .side nav { padding: 14px 12px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .side .group { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--side-text); opacity: .7; padding: 14px 10px 6px; }
  .side .item { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 7px; color: var(--side-text); font-weight: 500; position: relative; }
  .side .item:hover { background: var(--side-hover); color: var(--side-strong); }
  .side .item.active { background: var(--side-active); color: var(--side-strong); }
  .side .item.active::before { content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--teal-solid); }
  .side .item.locked { opacity: .45; }
  .side .item .count { margin-left: auto; font-size: 11px; font-weight: 600; background: var(--teal-solid); color: #06281F; border-radius: 999px; padding: 1px 7px; }
  .side .item .lock { margin-left: auto; opacity: .8; }
  .side .foot { border-top: 1px solid var(--side-line); padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
  .side .foot .who { line-height: 1.25; }
  .side .foot .who b { color: var(--side-strong); font-weight: 600; display: block; font-size: 13px; }
  .side .foot .who span { font-size: 11.5px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; background: #1E3A6E; color: #fff; flex: none; }

  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
  .top { height: 64px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 32px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .crumbs { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .crumbs b { color: var(--ink); font-weight: 600; }
  .top .spacer { flex: 1; }
  .search { display: flex; align-items: center; gap: 8px; width: 300px; white-space: nowrap; overflow: hidden; height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); color: var(--subtle); }
  .search kbd { margin-left: auto; font-family: "IBM Plex Mono", monospace; font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--muted); }
  .icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); position: relative; cursor: pointer; }
  .icon-btn .dot { position: absolute; top: 7px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--red); border: 2px solid var(--surface); }
  .content { flex: 1; overflow: hidden; padding: 28px 32px; display: flex; flex-direction: column; gap: 20px; }

  /* ---------- Primitives ---------- */
  .page-head { display: flex; align-items: flex-end; gap: 16px; }
  .page-head h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); }
  .page-head p { margin: 4px 0 0; color: var(--muted); }
  .page-head .actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }

  .btn { height: 36px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 14px; border-radius: 8px; font: inherit; font-weight: 600; font-size: 13px; border: 1px solid transparent; cursor: pointer; white-space: nowrap; }
  .btn.primary { background: var(--primary); color: var(--on-primary); }
  .btn.primary:hover { background: var(--primary-hover); }
  .btn.secondary { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
  .btn.ghost { background: transparent; color: var(--muted); }
  .btn.success { background: var(--teal-solid); color: #04261D; }
  .btn.danger { background: var(--surface); color: var(--red); border-color: var(--line-strong); }
  .btn.sm { height: 30px; padding: 0 10px; font-size: 12.5px; }
  .btn.block { width: 100%; }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }

  .seg { display: inline-flex; padding: 3px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); }
  .seg span { padding: 4px 12px; border-radius: 6px; color: var(--muted); font-weight: 500; font-size: 12.5px; }
  .seg span.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); outline: 1px solid var(--line); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
  .card-h { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .card-h h3 { margin: 0; font-size: 14px; font-weight: 600; color: var(--ink); }
  .card-h .sub { color: var(--muted); font-size: 12.5px; }
  .card-h .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .card-b { padding: 16px 18px; }

  .kpis { display: grid; gap: 16px; }
  .kpi { padding: 16px 18px; }
  .kpi .label { color: var(--muted); font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
  .kpi .value { font-size: 24px; font-weight: 600; color: var(--ink); margin-top: 6px; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .kpi .foot { margin-top: 6px; font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .up { color: var(--teal); font-weight: 600; }
  .down { color: var(--red); font-weight: 600; }

  .badge { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.plain::before { display: none; }
  .b-teal { color: var(--teal); background: var(--teal-soft); }
  .b-blue { color: var(--blue); background: var(--blue-soft); }
  .b-amber { color: var(--amber); background: var(--amber-soft); }
  .b-red { color: var(--red); background: var(--red-soft); }
  .b-gray { color: var(--muted); background: var(--surface-2); outline: 1px solid var(--line); }

  table.t { width: 100%; border-collapse: collapse; }
  .t th { text-align: left; font-size: 11.5px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; color: var(--subtle); padding: 10px 14px; background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
  .t td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
  .t tr:last-child td { border-bottom: 0; }
  .t tr.sel td { background: var(--blue-soft); }
  .t .r { text-align: right; }
  .t .strong { color: var(--ink); font-weight: 600; }
  .t .muted { color: var(--muted); }

  .progress { height: 6px; border-radius: 999px; background: var(--tile-empty); overflow: hidden; }
  .progress > i { display: block; height: 100%; background: var(--teal-solid); border-radius: 999px; }

  .tiles { display: grid; gap: 4px; }
  .tiles i { aspect-ratio: 1; border-radius: 3px; background: var(--tile-empty); }
  .tiles i.on { background: var(--teal-solid); }
  .tiles i.me { background: var(--blue); }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12.5px; font-weight: 500; color: var(--ink); }
  .input { height: 40px; border: 1px solid var(--line-strong); border-radius: 8px; padding: 0 12px; display: flex; align-items: center; gap: 8px; color: var(--text); background: var(--surface); }
  .input.focus { border-color: var(--blue); box-shadow: var(--focus); }
  .input .ph { color: var(--subtle); }
  .hint { font-size: 12px; color: var(--muted); }

  .alert { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; border: 1px solid; }
  .alert b { color: var(--ink); }
  .alert.info { background: var(--blue-soft); border-color: color-mix(in srgb, var(--blue) 30%, transparent); color: var(--blue); }
  .alert.warn { background: var(--amber-soft); border-color: color-mix(in srgb, var(--amber) 35%, transparent); color: var(--amber); }
  .alert .txt { color: var(--text); }
  .alert .act { margin-left: auto; }

  .dl { display: grid; grid-template-columns: 1fr auto; row-gap: 10px; column-gap: 16px; }
  .dl dt { color: var(--muted); white-space: nowrap; }
  .dl dd { margin: 0; text-align: right; color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
  .divider { height: 1px; background: var(--line); margin: 14px 0; }
  .row { display: flex; align-items: center; gap: 10px; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--muted); }
  .ink { color: var(--ink); }

  .thumb { border-radius: 8px; position: relative; overflow: hidden; display: grid; place-items: center; color: rgba(255,255,255,.85); }
  .thumb svg.i { width: 36px; height: 36px; stroke-width: 1.4; }
  .t .thumb svg.i, .row > .thumb svg.i { width: 16px; height: 16px; stroke-width: 1.8; }
  .g1 { background: linear-gradient(135deg, #1A8F7A 0%, #0A2148 100%); }
  .g2 { background: linear-gradient(135deg, #1D5FD8 0%, #0A2148 100%); }
  .g3 { background: linear-gradient(135deg, #0A2148 0%, #178C78 100%); }
  .g4 { background: linear-gradient(135deg, #344A73 0%, #0A2148 100%); }
  .g5 { background: linear-gradient(135deg, #0F5E73 0%, #0A2148 100%); }

  .steps { display: flex; align-items: center; gap: 0; }
  .step { display: flex; align-items: center; gap: 10px; flex: 1; }
  .step .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 12.5px; border: 1.5px solid var(--line-strong); color: var(--muted); background: var(--surface); flex: none; }
  .step.done .n { background: var(--teal-solid); border-color: var(--teal-solid); color: #04261D; }
  .step.cur .n { border-color: var(--blue); color: var(--blue); box-shadow: var(--focus); }
  .step .lbl { font-weight: 600; color: var(--ink); font-size: 13px; }
  .step .s { font-size: 12px; color: var(--muted); }
  .step .bar { flex: 1; height: 1.5px; background: var(--line-strong); margin: 0 14px; }
  .step.done .bar { background: var(--teal-solid); }

  .timeline { display: flex; flex-direction: column; gap: 0; }
  .tl { display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; padding-bottom: 14px; position: relative; }
  .tl::before { content: ""; position: absolute; left: 9px; top: 20px; bottom: 0; width: 1.5px; background: var(--line); }
  .tl:last-child::before { display: none; }
  .tl .d { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line-strong); background: var(--surface); display: grid; place-items: center; }
  .tl.done .d { background: var(--teal-solid); border-color: var(--teal-solid); color: #04261D; }
  .tl.cur .d { border-color: var(--blue); box-shadow: var(--focus); }
  .tl.cur .d::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--blue); }
  .tl .d svg.i { width: 12px; height: 12px; stroke-width: 3; }
  .tl b { color: var(--ink); font-weight: 600; font-size: 13px; display: block; }
  .tl span { color: var(--muted); font-size: 12px; }

  .kanban { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; flex: 1; min-height: 0; }
  .col { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  .col-h { display: flex; align-items: center; gap: 8px; padding: 2px 4px 4px; font-weight: 600; color: var(--ink); font-size: 12.5px; }
  .col-h .c { margin-left: auto; color: var(--muted); font-weight: 500; }
  .kcard { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; }
  .kcard b { color: var(--ink); font-weight: 600; }
  .kcard .meta { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }

  .voucher { border: 1px solid var(--line); border-radius: 8px; background: #FFFFFF; color: #1F2937; padding: 14px 16px; font-size: 12px; position: relative; }
  [data-theme="dark"] .voucher { background: #F3F5F8; }
  .voucher .vh { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #C9D0DB; padding-bottom: 10px; margin-bottom: 10px; }
  .voucher .vh b { color: #002A8D; font-size: 15px; letter-spacing: .02em; }
  .voucher .vr { display: flex; justify-content: space-between; padding: 3px 0; }
  .voucher .vr span:first-child { color: #6B7280; }
  .voucher .amt { font-size: 18px; font-weight: 700; color: #111827; }

  .drop { border: 1.5px dashed var(--line-strong); border-radius: 10px; padding: 18px; text-align: center; color: var(--muted); background: var(--surface-2); }
  .drop b { color: var(--ink); }

  .swatch { display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: center; }
  .swatch i { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); }
  .swatch b { display: block; color: var(--ink); font-weight: 600; font-size: 12.5px; }
  .swatch span { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--muted); }
</style>
</head>

function shell({ nav, user, active, crumbs, body, locked = false, currency = true }) {
  const groups = NAV[nav].map((grp) => `
    ${grp.g ? `<div class="group">${grp.g}</div>` : ''}
    ${grp.items.map(([id, label, icon, count]) => {
      const isLocked = locked && (id === 'wallet' || id === 'cartera');
      return `<a class="item ${id === active ? 'active' : ''} ${isLocked ? 'locked' : ''}">${I(icon)}<span>${label}</span>${
        isLocked ? `<span class="lock">${I('lock')}</span>` : count ? `<span class="count">${count}</span>` : ''}</a>`;
    }).join('')}`).join('');
  const u = USERS[user];
  return `
  <div class="app">
    <aside class="side">
      <div class="brand">${logo(26, true)}<span class="env">${nav === 'back' ? 'Backoffice' : 'Prod'}</span></div>

    <section class="main">

        <span class="icon-btn">${I('bell')}<span class="dot"></span></span>

    </section>
  </div>`;
}

const setTheme = (t) => {
  document.documentElement.dataset.theme = t;
  document.querySelectorAll('#theme-seg span').forEach((s) => s.classList.toggle('on', s.dataset.t === t));
  document.querySelectorAll('.moon').forEach((s) => (s.style.display = t === 'dark' ? 'none' : ''));
  document.querySelectorAll('.sun').forEach((s) => (s.style.display = t === 'dark' ? '' : 'none'));
};

const only = params.get('screen');

document.querySelectorAll('#theme-seg span').forEach((s) => s.addEventListener('click', () => setTheme(s.dataset.t)));

});
